name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PORTFOLIO_SITE: https://burak-gokce.github.io
  PORTFOLIO_BASE: /data-science-portfolio
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    if: github.repository == 'Burak-Gokce/data-science-portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/verify-release.mjs --tracked
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/verify-release.mjs --output
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
